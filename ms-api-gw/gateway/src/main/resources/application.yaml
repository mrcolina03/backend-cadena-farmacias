spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Validamos via JWK Set directo para evitar problemas de issuer hostname
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

  cloud:
    gateway:

      # ✅ CORS (WebFlux Gateway)
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
            # ✅ Opción A (Bearer token): NO cookies
            allowCredentials: false
            maxAge: 3600

      routes:
        - id: c-catalogo
          uri: ${CATALOGO_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/catalogo/**
          filters:
            - TokenRelay=

        - id: c-inventario
          uri: ${INVENTARIO_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/inventario/**
          filters:
            - TokenRelay=

        - id: c-ventas
          uri: ${VENTAS_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/ventas/**
          filters:
            - TokenRelay=

        - id: c-reportes
          uri: ${VENTAS_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/reportes/**
          filters:
            - TokenRelay=

        - id: c-usuarios
          uri: ${OAUTH_SERVER_URI:http://localhost:8084}
          predicates:
            - Path=/api/usuarios/**,/api/roles/**
          filters:
            - TokenRelay=

server:
  port: 8085

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.web.reactive: INFO
    reactor.netty.http.client: INFO
