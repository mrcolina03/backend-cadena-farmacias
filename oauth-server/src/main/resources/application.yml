server:
  port: 9000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/authdb
    username: postgres
    password: postgres
  jdbc:
    template:
      query-timeout: 30
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.provisioning.JdbcUserDetailsManager: DEBUG
    org.springframework.jdbc.core: DEBUG
