version: "3.9"

services:
  # ==========================
  # DB MySQL (para ms-catalogo, ms-inventario, ms-ventas)
  # ==========================
  mysql-sisdb2025:
    image: mysql:8.0
    container_name: mysql-sisdb2025
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: abcd
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    networks:
      - red_cadena_farmacia

  # ==========================
  # DB PostgreSQL (solo para oauth-server)
  # ==========================
  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
      # opcional: script de tablas users/authorities
      # - ./oauth-server/init-auth.sql:/docker-entrypoint-initdb.d/init-auth.sql
    networks:
      - red_cadena_farmacia

  # ==========================
  # OAuth Authorization Server
  # ==========================
  oauth-server:
    build:
      context: ./oauth-server
      dockerfile: Dockerfile
    container_name: oauth-server
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # DataSource postgres (IMPORTANTE: host = postgres-auth)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # Inicialización SQL (si usas schema.sql/data.sql)
      SPRING_SQL_INIT_MODE: always

      # Issuer (IMPORTANTE: accesible por el navegador para el redirect)
      AUTH_ISSUER: http://localhost:9000

    depends_on:
      - postgres-auth
    networks:
      - red_cadena_farmacia

  # ==========================
  # Microservicio Catálogo (Puerto 8081)
  # ==========================
  ms-catalogo:
    build:
      context: ./ms-catalogo/ms-catalogo
      dockerfile: Dockerfile
    container_name: ms-catalogo
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql-sisdb2025
      DB_PORT: 3306
      DB_USER: root
      DB_PWD: abcd
      DB_NAME: catalogo_db

      # Resource Server - Validación interna vía JWK Set (porque issuer localhost no es alcanzable internamente)
      # Apunta a oauth-server interno
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth-server:9000/oauth2/jwks
    depends_on:
      - mysql-sisdb2025
      - oauth-server
    networks:
      - red_cadena_farmacia

  # ==========================
  # Microservicio Inventario (Puerto 8082)
  # ==========================
  ms-inventario:
    build:
      context: ./ms-inventario/ms-inventariov2
      dockerfile: Dockerfile
    container_name: ms-inventario
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql-sisdb2025
      DB_PORT: 3306
      DB_USER: root
      DB_PWD: abcd
      DB_NAME: inventario_db
      API_CATALOGO: ms-catalogo
      FRONTEND: frontend-cadena-farmacia
      FRONTEND_PORT: 80

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth-server:9000/oauth2/jwks
    depends_on:
      - mysql-sisdb2025
      - ms-catalogo
      - oauth-server
    networks:
      - red_cadena_farmacia

  # ==========================
  # Microservicio Ventas (Puerto 8083)
  # ==========================
  ms-ventas:
    build:
      context: ./ms-ventas/ms-ventas
      dockerfile: Dockerfile
    container_name: ms-ventas
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-sisdb2025
      DB_PORT: 3306
      DB_NAME: ventas_db
      DB_USER: root
      DB_PASSWORD: abcd
      INVENTARIO_URL: http://ms-inventario:8082

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth-server:9000/oauth2/jwks
    depends_on:
      - mysql-sisdb2025
      - ms-inventario
      - oauth-server
    networks:
      - red_cadena_farmacia

  # ==========================
  # API Gateway (Puerto 8085)
  # ==========================
  ms-gw:
    build:
      context: ./ms-api-gw/gateway
      dockerfile: Dockerfile
    container_name: ms-gw
    ports:
      - "8085:8085"
    environment:
      CATALOGO_SERVICE_URI: http://ms-catalogo:8081
      INVENTARIO_SERVICE_URI: http://ms-inventario:8082
      VENTAS_SERVICE_URI: http://ms-ventas:8083
      USERS_SERVICE_URI: http://ms-usuarios:8084

      # Gateway como Resource Server (valida JWT)
      # Usamos jwk-set-uri interno porque issuer http://localhost:9000 no se resuelve aquí
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth-server:9000/oauth2/jwks
      # OAUTH_ISSUER_URI: Debe estar vacío o no usarse si usamos JWK Set directo
    depends_on:
      - ms-catalogo
      - ms-inventario
      - ms-ventas
      - ms-usuarios
      - oauth-server
    networks:
      - red_cadena_farmacia

  # ==========================
  # Microservicio Usuarios (Puerto 8084)
  # ==========================
  ms-usuarios:
    build:
      context: ./ms-usuarios/ms-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: ms-usuarios

      # 👇 MISMA BASE QUE oauth-server
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "true"

      # Resource Server (JWT del oauth-server)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth-server:9000/oauth2/jwks

    depends_on:
      - postgres-auth
      - oauth-server
    networks:
      - red_cadena_farmacia


  # ==========================
  # Frontend (React / Vite)
  # ==========================
  frontend-cadena-farmacia:
    build:
      context: ./FRONT/frontend-cadena-farmacias
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8085/api/catalogo"
        VITE_API_INVENTARIO_URL: "http://localhost:8085/api/inventario"
        VITE_API_VENTAS_URL: "http://localhost:8085/api/ventas"
        VITE_OAUTH_ISSUER: "http://localhost:9000"   # el navegador usa localhost (host)
        VITE_OAUTH_CLIENT_ID: "react-client"
        VITE_OAUTH_REDIRECT_URI: "http://localhost:5173/callback"
    container_name: frontend-cadena-farmacia
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:8085/api/catalogo"
      VITE_API_INVENTARIO_URL: "http://localhost:8085/api/inventario"
      VITE_API_VENTAS_URL: "http://localhost:8085/api/ventas"
      VITE_OAUTH_ISSUER: "http://localhost:9000"
      VITE_OAUTH_CLIENT_ID: "react-client"
      VITE_OAUTH_REDIRECT_URI: "http://localhost:5173/callback"
    depends_on:
      - ms-gw
    networks:
      - red_cadena_farmacia

networks:
  red_cadena_farmacia:
    driver: bridge

volumes:
  db_data:
  pg_auth_data:
